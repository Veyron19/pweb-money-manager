<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>Money Manager</h1>
      <p>Catat keuangan usaha dengan lebih mudah.</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Tambah Transaksi</h2>

      <form id="transaction-form">
        <div class="form-group">
          <label for="date">Tanggal</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="type">Jenis Transaksi</label>
          <select id="type" required>
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Kategori</label>
          <select id="category" required>
            <option value="Penjualan">Penjualan</option>
            <option value="Modal">Modal</option>
            <option value="Belanja Stok">Belanja Stok</option>
            <option value="Operasional">Operasional</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div class="form-group">
          <label for="amount">Nominal (Rp)</label>
          <input
            type="number"
            id="amount"
            min="1"
            step="1"
            placeholder="Contoh: 50000"
            required
          >
        </div>

        <div class="form-group">
          <label for="note">Catatan (opsional)</label>
          <input
            type="text"
            id="note"
            placeholder="Contoh: Penjualan hari ini"
          >
        </div>

        <button type="submit">Tambah Transaksi</button>
      </form>
    </section>

    <section class="panel">
      <h2>Daftar Transaksi</h2>
      <p id="empty-message">Belum ada transaksi.</p>
      <div id="transaction-list"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Money Manager · Pengelolaan Keuangan Usaha</p>
  </footer>
</body>
</html>
